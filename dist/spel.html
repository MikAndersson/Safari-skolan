<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Djurkompisarna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: helskärmsvyer ovanpå ritade landskap, stora tryckytor, djuren som guider. */
:root {
  --ink: #26324A; --ink-2: #4A5873; --muted: #6B7A93; --sky: #9FD8E8; --sun: #FFC93C; --sun-d: #D99A00;
  --leaf: #3FA66B; --leaf-d: #2A7F4E; --water: #4FB3D9; --berry: #8E6CC9; --good: #35B26B; --card: #FFFFFF; --grass: #B5CC63;
  --display: Fredoka, "Baloo 2", "Trebuchet MS", system-ui, sans-serif; --body: Nunito, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
body { background: var(--sky); color: var(--ink); font-family: var(--body); font-weight: 700; overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
#app { height: 100%; position: relative; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 1.6vmin; padding: max(16px, 2.4vmin); overflow: hidden; }
.screen > * { position: relative; z-index: 1; }
.scenery { position: absolute !important; inset: 0; width: 100%; height: 100%; z-index: 0 !important; }
.icon { width: 1em; height: 1em; display: block; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; }

/* knappar */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5em; background: var(--sun); color: var(--ink); font-family: var(--display); font-weight: 700; font-size: clamp(20px, 4vmin, 34px); padding: .5em 1.4em; border-radius: 999px; box-shadow: 0 .18em 0 var(--sun-d); transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translateY(.14em); box-shadow: 0 .04em 0 var(--sun-d); }
.btn.green { background: var(--leaf); color: #fff; box-shadow: 0 .18em 0 var(--leaf-d); }
.btn.green:active { box-shadow: 0 .04em 0 var(--leaf-d); }
.btn.plain { background: #fff; box-shadow: 0 .18em 0 #C7D2E0; font-size: clamp(16px, 2.6vmin, 22px); }
.btn.small { font-size: clamp(15px, 2.2vmin, 19px); }
.btn .icon { font-size: 1.2em; }
.iconbtn { width: clamp(52px, 9vmin, 76px); aspect-ratio: 1; display: grid; place-items: center; border-radius: 50%; background: #fff; color: var(--ink); font-size: clamp(26px, 4.6vmin, 38px); box-shadow: 0 .09em 0 #C7D2E0; flex: none; }
.iconbtn:active { transform: translateY(3px); box-shadow: none; }
.holdbtn { position: relative; width: clamp(48px, 8vmin, 64px); aspect-ratio: 1; display: grid; place-items: center; border-radius: 50%; background: rgba(255, 255, 255, .75); color: var(--ink-2); font-size: clamp(22px, 3.6vmin, 30px); flex: none; }
.holdbtn .ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.holdbtn .ring circle { fill: none; stroke: var(--leaf); stroke-width: 4; stroke-dasharray: 120; stroke-dashoffset: 120; }
.holdbtn.holding .ring circle { animation: ring 1.5s linear forwards; }
@keyframes ring { to { stroke-dashoffset: 0; } }
.grow { flex: 1; }

/* djur */
.animal { width: 100%; height: auto; display: block; overflow: visible; }
.animal .eh, .animal .m-open { display: none; }
.cheer .animal .eo, .sleep .animal .eo { display: none; }
.cheer .animal .eh, .sleep .animal .eh { display: inline; }
.cheer .animal .m-open { display: inline; }
.cheer .animal .m-smile { display: none; }
.cheer .animal .trunk { transform: rotate(-16deg); transform-origin: 100px 112px; }
.think .animal .head { transform: rotate(-5deg); transform-origin: 100px 160px; }
.cheer .animal { animation: hop .6s ease; }
@keyframes hop { 30% { transform: translateY(-9%) scale(1.04); } 60% { transform: translateY(0) scale(.98); } }

/* profiler och guide */
.profiles, .wizard { background: linear-gradient(180deg, #A9DCE8 0%, #FBE9B4 100%); align-items: center; justify-content: center; text-align: center; }
.profiles .title { font-size: clamp(30px, 7vmin, 60px); }
.tiles { display: flex; flex-wrap: wrap; gap: 3vmin; justify-content: center; max-width: 920px; }
.tile { width: clamp(120px, 24vmin, 210px); padding: 1.6vmin; background: #fff; border-radius: 32px; box-shadow: 0 .4vmin 0 #C7D2E0; display: grid; gap: 1vmin; justify-items: center; font-family: var(--display); font-size: clamp(16px, 2.8vmin, 24px); }
.tile:active { transform: translateY(3px); }
.tile .tname { min-height: 1.2em; }
.addtile { color: var(--ink-2); align-content: center; }
.addtile .icon { font-size: clamp(48px, 10vmin, 90px); color: var(--leaf); }
.wizard { justify-content: flex-start; overflow-y: auto; }
.wiz { width: min(100%, 760px); display: grid; gap: 2vmin; text-align: left; padding-block: 1vmin 4vmin; }
.wiz .chip { justify-self: start; background: var(--ink); color: #fff; border-radius: 999px; padding: .2em .9em; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; }
.wiz h2 { font-size: clamp(26px, 5vmin, 40px); }
.wiz p { margin: 0; font-size: clamp(16px, 2.6vmin, 20px); color: var(--ink-2); line-height: 1.4; }
.dots { display: flex; gap: 6px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: rgba(38, 50, 74, .2); }
.dots i.on { background: var(--leaf); }
.opts { display: grid; gap: 1.2vmin; }
.opt { background: #fff; border: 4px solid transparent; border-radius: 20px; padding: .8em 1.1em; font-size: clamp(17px, 2.8vmin, 22px); text-align: left; box-shadow: 0 4px 0 #C7D2E0; display: flex; align-items: center; gap: .7em; }
.opt .box { width: 1.4em; height: 1.4em; border-radius: 50%; border: 3px solid var(--muted); flex: none; display: grid; place-items: center; color: #fff; }
.opt.multi .box { border-radius: 8px; }
.opt.sel { border-color: var(--leaf); }
.opt.sel .box { background: var(--leaf); border-color: var(--leaf); }
.opt .box .icon { font-size: 1em; opacity: 0; }
.opt.sel .box .icon { opacity: 1; }
.pick { display: flex; gap: 2vmin; flex-wrap: wrap; }
.pick .tile { width: clamp(96px, 19vmin, 160px); border: 5px solid transparent; }
.pick .tile.sel { border-color: var(--leaf); }
.field { display: grid; gap: 6px; }
.field input { font: inherit; font-size: 20px; padding: .6em .8em; border-radius: 16px; border: 3px solid #C7D2E0; background: #fff; color: var(--ink); max-width: 360px; user-select: text; -webkit-user-select: text; }
.navrow { display: flex; gap: 2vmin; justify-content: space-between; align-items: center; flex-wrap: wrap; }

/* karta */
.map .mtop { display: flex; align-items: center; gap: 2vmin; }
.avatar { width: clamp(52px, 10vmin, 84px); aspect-ratio: 1; border-radius: 50%; background: #fff; padding: 6px; box-shadow: 0 .4vmin 0 #C7D2E0; }
.starcount { display: flex; align-items: center; gap: .3em; background: #fff; border-radius: 999px; padding: .2em .8em .2em .5em; font-family: var(--display); font-size: clamp(20px, 3.6vmin, 30px); box-shadow: 0 .4vmin 0 #C7D2E0; }
.starcount .icon { color: var(--sun); font-size: 1.2em; }
.places { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-content: center; justify-items: center; gap: 1.5vmin 4vmin; }
@media (min-aspect-ratio: 8/5) { .places { grid-template-columns: repeat(4, minmax(0, 1fr)); } .place:nth-child(even) { transform: translateY(5vmin); } }
.place { position: relative; width: min(100%, 36vmin, 240px); display: grid; justify-items: center; gap: .8vmin; font-family: var(--display); font-size: clamp(15px, 2.6vmin, 22px); text-align: center; }
.place:active .pface { transform: scale(.96); }
.pface { width: 78%; aspect-ratio: 1; border-radius: 50%; background: rgba(255, 255, 255, .9); padding: 5%; box-shadow: 0 .6vmin 0 rgba(38, 50, 74, .18); transition: transform .1s; }
.place.rec .pface { animation: pulse 1.6s ease-in-out infinite; box-shadow: 0 0 0 1.2vmin rgba(255, 201, 60, .85), 0 .6vmin 0 rgba(38, 50, 74, .18); }
@keyframes pulse { 50% { transform: scale(1.06); } }
.pname { background: rgba(255, 255, 255, .92); border-radius: 999px; padding: .1em .8em; }
.pbar { width: 62%; height: 10px; background: rgba(255, 255, 255, .7); border-radius: 999px; overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--leaf); border-radius: 999px; }
.place.sleep .pface { filter: grayscale(.7); opacity: .8; }
.zzz, .badge { position: absolute; right: 12%; top: 0; width: 2em; height: 2em; border-radius: 50%; display: grid; place-items: center; font-size: 1em; }
.zzz { background: #fff; color: var(--berry); }
.badge { background: var(--good); color: #fff; }
.zzz .icon, .badge .icon { font-size: 1.2em; }
.playbtn { align-self: center; margin-bottom: 1vmin; }

/* runda */
.round { background: linear-gradient(180deg, #CFEBF2 0%, #FFF3CF 100%); }
.round.place-beaver { background: linear-gradient(180deg, #BDE6F0 0%, #CDEBDD 100%); }
.round.place-zebra { background: linear-gradient(180deg, #D9EFB8 0%, #F3F7D7 100%); }
.round.place-lion { background: linear-gradient(180deg, #FCE3A8 0%, #FFF4D4 100%); }
.round.place-elephant { background: linear-gradient(180deg, #BFD9F2 0%, #E6F1FB 100%); }
.rtop { display: flex; align-items: center; justify-content: space-between; gap: 2vmin; }
.pips { display: flex; gap: 1.6vmin; }
.pip { width: clamp(28px, 6vmin, 46px); aspect-ratio: 1; border-radius: 50%; background: rgba(255, 255, 255, .8); display: grid; place-items: center; color: #fff; font-size: clamp(18px, 4vmin, 30px); transition: background .2s, transform .2s; }
.pip.cur { box-shadow: 0 0 0 4px var(--ink); }
.pip.on { background: var(--sun); }
.pip.on.gold { background: #FFB800; transform: scale(1.12); }
.pip .icon { opacity: 0; }
.pip.on .icon { opacity: 1; }
.rbody { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, clamp(110px, 24vmin, 230px)) minmax(0, 1fr); gap: 3vmin; align-items: center; }
.hcol { display: flex; flex-direction: column; align-items: center; gap: 1.2vmin; align-self: start; padding-top: 1vmin; }
.helper { width: 100%; }
.bubble { background: #fff; border-radius: 22px; padding: .6em .9em; font-size: clamp(13px, 2.1vmin, 18px); line-height: 1.3; text-align: center; box-shadow: 0 4px 0 rgba(38, 50, 74, .12); min-height: 1.4em; font-weight: 700; }
.bubble:empty { visibility: hidden; }
@media (max-aspect-ratio: 1/1) { .rbody { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); } .hcol { flex-direction: row; align-self: stretch; } .helper { width: clamp(70px, 20vmin, 130px); flex: none; } .bubble { text-align: left; flex: 1; } }
.stage { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.4vmin; min-height: 0; height: 100%; }
.vis { display: flex; flex-wrap: wrap; gap: 1.6vmin; justify-content: center; align-items: center; max-width: 100%; }
.vis.eq { gap: 2vmin; }
.vis.hearme { font-size: clamp(70px, 16vmin, 130px); color: var(--leaf); }
.vis.coins .coin { width: clamp(52px, 11vmin, 90px); }
.vis.pairs { gap: 2vmin; max-width: min(100%, 640px); }
.pair { display: inline-flex; background: rgba(255, 255, 255, .7); border-radius: 18px; padding: .1em .3em; }
.grp { display: inline-flex; flex-wrap: wrap; gap: .25em; justify-content: center; max-width: min(100%, 520px); font-size: clamp(30px, 7.2vmin, 62px); }
.grp.cols { display: inline-grid; grid-template-columns: repeat(var(--cols), auto); }
.grp .g { position: relative; display: block; line-height: 1; }
.grp .g.gone { opacity: .35; filter: grayscale(1); }
.grp .g.gone::after { content: ""; position: absolute; left: -4%; right: -4%; top: 50%; height: 5px; background: var(--berry); transform: rotate(-35deg); border-radius: 4px; }
.obj.emo { display: inline-block; line-height: 1; font-size: 1em; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
.obj.emo.big { font-size: clamp(40px, 9vmin, 78px); }
.obj.emo.huge { font-size: clamp(80px, 20vmin, 160px); }
svg.obj.log { width: 1.5em; height: auto; display: block; }
.op { font-family: var(--display); font-size: clamp(30px, 7vmin, 60px); color: var(--ink-2); }
.expr { font-family: var(--display); font-size: clamp(30px, 6vmin, 52px); }
.expr.big { font-size: clamp(56px, 14vmin, 120px); letter-spacing: .04em; }
.seq { display: flex; gap: 2vmin; align-items: center; justify-content: center; flex-wrap: wrap; }
.seq .num { font-family: var(--display); font-size: clamp(48px, 11vmin, 96px); }
.seq .tok { width: clamp(38px, 9vmin, 72px); }
.slot { display: grid; place-items: center; min-width: 1.3em; aspect-ratio: 1; border-radius: 20px; border: 5px dashed var(--ink-2); font-family: var(--display); font-size: clamp(36px, 8vmin, 68px); color: var(--ink-2); padding: 0 .2em; }
.tenframe { width: clamp(180px, 40vmin, 340px); } .dice { width: clamp(90px, 22vmin, 170px); } .array { max-width: min(100%, 420px); max-height: 34vmin; width: auto; height: clamp(90px, 28vmin, 240px); }
.blocks { height: clamp(100px, 26vmin, 200px); width: auto; max-width: 100%; }
.word { font-family: var(--display); }
.word.big { font-size: clamp(60px, 15vmin, 130px); background: #fff; padding: .1em .5em; border-radius: 28px; box-shadow: 0 6px 0 #C7D2E0; }
.sentence { font-family: var(--display); font-size: clamp(28px, 6vmin, 52px); text-align: center; background: #fff; border-radius: 28px; padding: .5em .8em; box-shadow: 0 6px 0 #C7D2E0; max-width: 100%; text-wrap: balance; }
.story { font-size: clamp(18px, 3.2vmin, 28px); line-height: 1.5; background: #fff; border-radius: 24px; padding: .8em 1.1em; box-shadow: 0 6px 0 #C7D2E0; max-width: 700px; font-weight: 700; }
.qline { font-family: var(--display); font-size: clamp(22px, 3.8vmin, 32px); text-align: center; }
.listen { display: inline-flex; align-items: center; gap: .4em; background: var(--leaf); color: #fff; border-radius: 999px; padding: .4em 1.1em; font-family: var(--display); font-size: clamp(18px, 3vmin, 24px); box-shadow: 0 5px 0 var(--leaf-d); }
.listen .icon { font-size: 1.3em; }

/* svarskort */
.choices { display: flex; justify-content: center; align-items: stretch; gap: 2.4vmin; flex-wrap: wrap; min-height: clamp(96px, 24vmin, 210px); padding-bottom: 1vmin; }
.card { width: clamp(92px, 24vmin, 210px); aspect-ratio: 1; display: grid; place-items: center; background: var(--card); border: 5px solid var(--ink); border-radius: 30px; box-shadow: 0 .8vmin 0 var(--ink); font-family: var(--display); transition: transform .12s, background .2s, opacity .2s; padding: 4px; }
.card:active { transform: translateY(.6vmin); box-shadow: 0 .2vmin 0 var(--ink); }
.choices.wide .card { aspect-ratio: auto; width: clamp(130px, 30vmin, 270px); min-height: clamp(96px, 24vmin, 210px); }
.choices.text { flex-direction: column; align-items: center; }
.choices.text .card { aspect-ratio: auto; width: min(100%, 560px); padding: .7em 1em; font-size: clamp(18px, 3vmin, 26px); font-weight: 700; }
.card .num { font-size: clamp(48px, 12vmin, 104px); line-height: 1; }
.card .num[data-len="2"] { font-size: clamp(40px, 10vmin, 86px); }
.card .letter { font-size: clamp(54px, 13vmin, 112px); line-height: 1; }
.card .shape, .card .tok { width: 78%; }
.card .clock { width: 100%; }
.card .grpcard .grp { font-size: clamp(18px, 4.4vmin, 36px); }
.card .word { font-size: clamp(24px, 5vmin, 44px); }
.card .thumb { width: clamp(46px, 9vmin, 76px); height: auto; }
.card .icon.up { color: var(--good); } .card .icon.down { color: var(--berry); }
.choices.wide .card .icon { margin-bottom: .1em; }
.card.good { background: #D6F5E1; border-color: var(--good); box-shadow: 0 .8vmin 0 var(--good); animation: yay .5s ease; }
.card.nope { opacity: .35; background: #E9E3F6; border-color: var(--berry); box-shadow: none; animation: nudge .35s ease; }
.card.hint, .item.hint, .tile-l.hint, .okbtn.hint { animation: wiggle .9s ease-in-out infinite; border-color: var(--good); }
@keyframes yay { 40% { transform: scale(1.12) rotate(-2deg); } }
@keyframes nudge { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
@keyframes wiggle { 0%, 100% { transform: rotate(0) scale(1); } 25% { transform: rotate(-3deg) scale(1.06); } 75% { transform: rotate(3deg) scale(1.06); } }

/* ge N / bygg ord */
.give { display: grid; gap: 2vmin; width: min(100%, 780px); }
.pile, .damitems { display: flex; flex-wrap: wrap; gap: 1.4vmin; justify-content: center; align-items: center; }
.pile { min-height: clamp(70px, 14vmin, 130px); }
.item { font-size: clamp(30px, 6.8vmin, 58px); line-height: 1; padding: .12em; border-radius: 18px; border: 3px solid transparent; }
.item:active { transform: scale(.92); }
.dam { position: relative; background: linear-gradient(180deg, #8AD0EA, #4FB3D9); border: 6px solid #A9713F; border-radius: 28px; min-height: clamp(110px, 24vmin, 200px); padding: 1.6vmin; display: grid; align-content: center; }
.dam .count { position: absolute; top: -.2em; left: 50%; transform: translateX(-50%); background: #fff; font-family: var(--display); font-size: clamp(24px, 5vmin, 42px); min-width: 1.6em; text-align: center; border-radius: 999px; padding: 0 .4em; border: 4px solid #A9713F; }
.dam .damitems { padding-top: 3vmin; }
.okbtn { width: clamp(90px, 20vmin, 150px); aspect-ratio: 1; border-radius: 50%; background: var(--leaf); color: #fff; display: grid; place-items: center; font-size: clamp(48px, 11vmin, 84px); box-shadow: 0 .8vmin 0 var(--leaf-d); border: 4px solid transparent; }
.okbtn:active { transform: translateY(.6vmin); box-shadow: 0 .2vmin 0 var(--leaf-d); }
.buildpic { display: grid; place-items: center; }
.slots { display: flex; gap: 1.4vmin; justify-content: center; flex-wrap: wrap; }
.slot-l { width: clamp(44px, 10vmin, 84px); height: clamp(56px, 12.5vmin, 100px); border-radius: 18px; border-bottom: 8px solid var(--ink-2); background: rgba(255, 255, 255, .6); display: grid; place-items: center; font-family: var(--display); font-size: clamp(34px, 8vmin, 66px); }
.slot-l.filled { background: #fff; border-color: var(--good); animation: yay .4s ease; }
.tile-l { width: clamp(56px, 13vmin, 104px); aspect-ratio: 1; background: #fff; border: 5px solid var(--ink); border-radius: 24px; box-shadow: 0 .7vmin 0 var(--ink); font-family: var(--display); font-size: clamp(34px, 8vmin, 66px); }
.tile-l:active { transform: translateY(.5vmin); box-shadow: 0 .1vmin 0 var(--ink); }
.tile-l.used { visibility: hidden; }
.tile-l.nope { animation: nudge .35s ease; opacity: .5; }
.choices.tray { gap: 1.6vmin; }

/* belöning */
.reward { background: linear-gradient(180deg, #FFE9A8 0%, #FFD3E0 100%); align-items: center; justify-content: center; text-align: center; gap: 2vmin; overflow-y: auto; }
.rwanimal { width: clamp(120px, 28vmin, 220px); }
.rwitem { font-size: clamp(70px, 18vmin, 140px); line-height: 1; animation: pop .8s cubic-bezier(.2, 1.6, .4, 1); font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
@keyframes pop { 0% { transform: scale(0) rotate(-20deg); } 100% { transform: scale(1) rotate(0); } }
.reward h2 { font-size: clamp(26px, 5.4vmin, 46px); }
.rwstars { display: flex; gap: 1vmin; font-size: clamp(30px, 6vmin, 50px); color: #FFB800; }
.rwbtns { display: flex; gap: 2.4vmin; align-items: center; }
.medals { display: grid; gap: .6vmin; font-size: clamp(14px, 2.2vmin, 18px); color: var(--ink-2); }
.medal { display: inline-flex; gap: .4em; align-items: center; justify-content: center; background: rgba(255, 255, 255, .85); border-radius: 999px; padding: .2em .9em; }
.medal .icon { color: #FFB800; }
.confetti { position: absolute !important; inset: 0; pointer-events: none; z-index: 0 !important; overflow: hidden; }
.confetti i { position: absolute; top: -6%; left: var(--x); width: 1.4vmin; height: 2.2vmin; background: var(--c); border-radius: 3px; animation: fall var(--d) linear var(--w) infinite; transform: rotate(var(--r)); }
@keyframes fall { to { transform: translateY(115vh) rotate(calc(var(--r) + 540deg)); } }

/* djurpark */
.park .ptop { display: flex; align-items: center; gap: 2vmin; }
.pitems { position: absolute !important; inset: 0; z-index: 1; }
.pitem { position: absolute; transform: translate(-50%, -100%); line-height: 1; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
.pitem:active { animation: wiggle .5s; }
.pitem.new { animation: pop .9s cubic-bezier(.2, 1.6, .4, 1); }
.parkempty { margin: auto; background: rgba(255, 255, 255, .9); border-radius: 24px; padding: 1em 1.4em; font-family: var(--display); font-size: clamp(18px, 3vmin, 26px); text-align: center; }

/* föräldravy */
.parent { background: linear-gradient(180deg, #DDEFF4, #F2F7F9); overflow-y: auto; display: block; }
.parent > * { max-width: 920px; margin-inline: auto; }

<script>
/* Djurkompisarna – ritade bilder (SVG som strängar). Inga beroenden. */
(function (App) {
  'use strict';
  const art = (App.art = {});
  let uid = 0;

  const TOK = { red: '#E4574F', blue: '#3D84E8', yellow: '#FFC93C', green: '#3FA66B', purple: '#8E6CC9', orange: '#F28F3B' };
  art.TOK = TOK;
  const INK = '#26324A';

  art.esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  /* ---------- former, föremål, mängder ---------- */
  art.shape = function (kind, col, cls) {
    const c = TOK[col] || col;
    let body = '';
    if (kind === 'circle') body = `<circle cx="50" cy="50" r="40" fill="${c}"/>`;
    else if (kind === 'square') body = `<rect x="14" y="14" width="72" height="72" rx="10" fill="${c}"/>`;
    else if (kind === 'triangle') body = `<path d="M50 14 L88 84 L12 84 Z" fill="${c}" stroke="${c}" stroke-width="10" stroke-linejoin="round"/>`;
    else body = `<rect x="6" y="26" width="88" height="48" rx="10" fill="${c}"/>`;
    return `<svg class="shape ${cls || ''}" viewBox="0 0 100 100" aria-hidden="true">${body}</svg>`;
  };

  art.log = function () {
    return '<svg class="obj log" viewBox="0 0 100 70" aria-hidden="true">' +
      '<rect x="6" y="14" width="72" height="44" rx="14" fill="#A9713F" stroke="#7A4B27" stroke-width="3"/>' +
      '<path d="M20 30h40M24 42h34" stroke="#8A5A31" stroke-width="3" stroke-linecap="round"/>' +
      '<ellipse cx="78" cy="36" rx="13" ry="22" fill="#E2B27A" stroke="#7A4B27" stroke-width="3"/>' +
      '<ellipse cx="78" cy="36" rx="7" ry="13" fill="none" stroke="#B9854F" stroke-width="3"/>' +
      '<circle cx="78" cy="36" r="2.5" fill="#B9854F"/></svg>';
  };

  art.emo = (e) => `<span class="obj emo">${e}</span>`;

  art.group = function (n, objHtml, opt) {
    opt = opt || {};
    const cross = opt.cross || 0;

    const title = arrived.length ? `Ny kompis: ${arrived.map((id) => C.PLACES[id].who).join(' och ')}!` : pieces.length ? 'Du fick något att bygga!' : res.full ? 'Safarit är fullt!' : 'Bra jobbat!';
    app().innerHTML = `<section class="screen reward cheer"><div class="confetti">${conf}</div><div class="rwanimal helper">${A.animal(P.animal)}</div>` +
      (items ? `<div class="rwpieces">${items}</div>` : '') +
      `<h2>${title}</h2>${res.full && !pieces.length ? '<p class="rwnote">Klara en hel årskurs så växer safarit.</p>' : ''}` +
      `<div class="rwstars">${Array.from({ length: R.stars }, (_, i) => `<span style="opacity:${i < R.gold ? 1 : 0.45}">${A.icon('star')}</span>`).join('')}</div>` +
      (medals ? `<div class="medals">${medals}</div>` : '') +
      `<div class="rwbtns"><button class="iconbtn" id="rhome2" aria-label="Hem">${A.icon('home')}</button>` +
      (pieces.length ? `<button class="btn green big" id="rbuild" aria-label="Bygg i safarit">${A.icon('hammer')}<span>Bygg</span></button>` : '') +
      `<button class="${pieces.length ? 'iconbtn' : 'btn green'}" id="again" aria-label="Spela mer">${A.icon('play')}${pieces.length ? '' : '<span>Spela mer</span>'}</button></div></section>`;
    $('#rhome2').addEventListener('click', () => U.map());
    $('#again').addEventListener('click', () => U.startRound(E.recommend(pl)));
    const rb = $('#rbuild'); if (rb) rb.addEventListener('click', () => { S.skipBuild = false; U.map({ build: true }); });
